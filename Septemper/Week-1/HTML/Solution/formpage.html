<!DOCTYPE html>
<html>  
    <boady>
        <h1>Application Form</h1>
        <form>
            <label for="fName">First Name:</label>
            <input type="text" id="fName">
            <label for="lName">Last Name:</label>
            <input type="text" id="lName">

            <br><br>

            <label for="date" >Date of birth:</label>
            <input type="date" id="date">
            <label for="age" >Age:</label>
            <input type="number" id="age" >

            <br><br>

            <label for="gender" >Gender:</label>
            <select>
                <option id="male">Male</option>
                <option id="female">Female</option>
            </select>
            <label for="email" >Email Address:</label>
            <input type="email" id="email"  placeholder="Enter email address" >

            <br><br>

            <label for="pAvailable" >Positions Available:</label>
            <input type="radio" id="jDeveloper" >
            <label for="jDeveloper" >Junior Developer</label>
            <input type="radio" id="mlDeveloper">
            <label for="mlDeveloper" >Mid-level Developer</label>
            <input type="radio" id="sDeveloper" >
            <label for="sDeveloper" >Senior Developer</label>

            <br><br>

            <label for="pLang" >Programming Languages:</label>
            <input type="checkbox" id="java">
            <label for="java" >Java</label>
            <input type="checkbox" id="javaScript" >
            <label for="javaScript" >JavaScript</label>
            <input type="checkbox" id="python" >
            <label for="python" >Python</label>

            <br><br>

            <label for="password" >Password:</label>
            <input type="password" id="password">
            <label for="cpassword">Confirm Password:</label>
            <input type="password" id="cpassword" >

            <br><br>

            <input type="submit" id="submit">
            <input type="reset" id="reset">

        </form>
    </boady>
</html>
